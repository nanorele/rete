name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  gate:
    name: Gate · trusted source check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    steps:
      - run: echo "Trusted source — downstream jobs are allowed to run."

  build-test-lint:
    needs: gate
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: ./.github/actions/setup-go-dl
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libffi-dev \
          libxcursor-dev \
          libvulkan-dev

    - name: Lint (go vet)
      run: go vet ./...

    - name: Build
      run: go build -v -o bin/tracto ./cmd

    - name: Run tests
      run: go test -coverpkg=./... -coverprofile=coverage.out ./...

    - name: Coverage summary
      run: go tool cover -func=coverage.out | tail -1

    - name: Race detector
      run: go test -race -count=1 -timeout 20m ./...

  ui-screenshots:
    needs: gate
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: ./.github/actions/setup-go-dl
      with:
        go-version-file: go.mod

    - name: Install GUI build deps + software GL (llvmpipe)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxkbcommon-x11-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libffi-dev \
          libxcursor-dev \
          libvulkan-dev \
          libgl1-mesa-dri \
          libegl-mesa0 \
          mesa-vulkan-drivers

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Python deps
      run: pip install numpy opencv-python

    - name: Render screenshots
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        GALLIUM_DRIVER: llvmpipe
        EGL_PLATFORM: surfaceless
      run: go test -tags screenshots ./internal/ui/apptest -run TestScreenshots -count=1 -v

    - name: Verify layout (contours + non-blank)
      run: python tools/uitest/verify.py --golden internal/ui/apptest/testdata/screenshots/golden-linux

    - name: Upload screenshots & report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ui-screenshots
        path: |
          internal/ui/apptest/testdata/screenshots/*.png
          internal/ui/apptest/testdata/screenshots/*.layout.json
          internal/ui/apptest/testdata/screenshots/report.html
          internal/ui/apptest/testdata/screenshots/annotated
          internal/ui/apptest/testdata/screenshots/diff
        if-no-files-found: error
